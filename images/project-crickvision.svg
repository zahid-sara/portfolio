<text x="60" y="440" font-family="IBM Plex Mono, monospace" font-size="12" fill="#4A544F">PRESCRIPTIVE INSIGHTS · PLAYER RANKINGS · BOWLING SYNERGY · FORM &amp; FATIGUE</text>
