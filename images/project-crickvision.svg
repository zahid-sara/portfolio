  <circle cx="490" cy="320" r="2.5"/><circle cx="520" cy="300" r="2.5"/><circle cx="550" cy="310" r="2.5"/>
  <circle cx="580" cy="260" r="2.5"/><circle cx="610" cy="280" r="2.5"/><circle cx="640" cy="230" r="2.5"/>
  <circle cx="670" cy="250" r="2.5"/><circle cx="700" cy="215" r="2.5"/><circle cx="715" cy="235" r="3" fill="#C1902F"/>
