<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="CrickVision cricket analytics dashboard illustration">
<title>CrickVision — cricket intelligence dashboard</title>
<rect width="800" height="500" fill="#F1F2ED"/>
