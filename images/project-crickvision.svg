  <rect x="566" y="90" width="174" height="66" fill="#FFFFFF" stroke="#B9B6A3" stroke-width="1"/>
  <text x="580" y="112" fill="#4A544F" font-size="9">FATIGUE INDEX</text>
  <text x="580" y="136" fill="#1B2321" font-size="17" font-family="Fraunces, serif" font-weight="600">Low</text>
